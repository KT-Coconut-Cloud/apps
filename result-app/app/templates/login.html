{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<section class="rv-login">
  <h1 class="rv-page-title">로그인</h1>
  <p class="rv-desc">사전 발급된 업무 계정으로 로그인하세요. 계정 발급과 비밀번호 초기화는 시스템 관리자에게 요청합니다.</p>

  {% if expired %}
  <div class="rv-notice">장시간 사용하지 않아 로그아웃되었습니다. 다시 로그인하세요.</div>
  {% endif %}

  <form method="post" action="/login" class="rv-login-form" autocomplete="off">
    <div class="fieldset">
      <div class="form-group">
        <div class="form-tit"><label for="username">아이디</label></div>
        <div class="form-conts{% if error %} is-error{% endif %}">
          <input type="text" id="username" name="username" class="krds-input" value="{{ username or '' }}" required autofocus>
        </div>
      </div>
      <div class="form-group">
        <div class="form-tit"><label for="password">비밀번호</label></div>
        <div class="form-conts{% if error %} is-error{% endif %}">
          <input type="password" id="password" name="password" class="krds-input" required>
        </div>
        {% if error %}<p class="form-hint-invalid">{{ error }}</p>{% endif %}
      </div>
    </div>
    <button type="submit" class="krds-btn primary large rv-full">로그인</button>
  </form>
</section>
{% endblock %}
