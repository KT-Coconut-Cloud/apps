version: rules-v0.1
k_anonymity:
  threshold: 2
tables:
  citizen:
    columns:
      citizen_id: {action: tokenize, key: citizen-id}
      name: {action: drop}
      rrn: {action: drop}
      birth_date: {action: drop}
      gender: {action: drop}
      phone: {action: drop}
      email: {action: drop}
      address: {action: generalize, method: sigungu, as: sigungu}
      household_type: {action: keep}
      income_level: {action: drop}
    quasi_identifiers: [sigungu, household_type]
  crisis_signal:
    columns:
      signal_id: {action: drop}
      citizen_id: {action: tokenize, key: citizen-id}
      signal_type: {action: keep, as: crisis_type}
      detected_date: {action: generalize, method: month, as: signal_month}
      consult_result: {action: map, as: linked, values: {지원 연계: 1}, default: 0}
      linked_service: {action: drop}
  benefit_payment:
    columns:
      payment_id: {action: drop}
      citizen_id: {action: tokenize, key: citizen-id}
      recipient_type: {action: drop}
      benefit_type: {action: map, values: {생계: 생계급여, 의료: 의료급여, 주거: 주거급여, 교육: 교육급여}}
      pay_month: {action: generalize, method: year, as: year}
      amount: {action: keep, as: monthly_amount}
